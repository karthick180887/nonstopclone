[build]
  command = "npm run build"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Canonical host: always serve www.droptaxi.live
[[redirects]]
  from = "https://droptaxi.live/*"
  to = "https://www.droptaxi.live/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://droptaxi.live/*"
  to = "https://www.droptaxi.live/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.droptaxi.live/*"
  to = "https://www.droptaxi.live/:splat"
  status = 301
  force = true

# Legacy domain → canonical (works when both domains point to this Netlify site)
[[redirects]]
  from = "https://www.nonstopdroptaxi.com/*"
  to = "https://www.droptaxi.live/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://nonstopdroptaxi.com/*"
  to = "https://www.droptaxi.live/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.nonstopdroptaxi.com/*"
  to = "https://www.droptaxi.live/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://nonstopdroptaxi.com/*"
  to = "https://www.droptaxi.live/:splat"
  status = 301
  force = true

[functions]
  node_bundler = "esbuild"
